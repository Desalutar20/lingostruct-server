[project]
name = "lingostruct-server"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "apscheduler>=3.11.3",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.5",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "redis>=8.1.0",
    "regex>=2026.11.9",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "faker>=40.54.0",
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.5",
]
